<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Lingua · Android voice + smart-glasses screens (simulated)</title>
<!--
  Simulated Android screens for the live voice-translation flow and the Brilliant Labs Frame
  (smart glasses) connection. They need hardware (microphone + glasses) to capture for real, so
  they are rendered from the app's real UI strings and theme (mobile/lib/core/theme.dart,
  widgets/frame_connect_sheet.dart, screens/translate/*). The glasses text layout re-implements
  FrameService.wrapForFrame / removeDiacritics.
-->
<style>
  :root{--paper:#F8F5EF;--sand:#EEE8DD;--ivory:#FFFDF9;--moss:#1B4B43;--coral:#F26B5E;--coralTint:#FBE0D8;--sage:#A9B9AC;--line:#D9D0C4;--cran:#A74443}
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,Roboto,"Noto Sans","DejaVu Sans",system-ui,sans-serif;background:#e7e9ec;padding:30px;display:flex;flex-direction:column;gap:40px;color:var(--moss)}
  .phone{width:390px;height:844px;border-radius:46px;background:#0c0e0d;padding:9px;position:relative;flex:none}
  .screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--paper);position:relative;display:flex;flex-direction:column}
  .status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:600;color:#1a1a1a;flex:none}
  .status i{display:inline-block;width:13px;height:9px;background:#1a1a1a;border-radius:2px;margin-left:5px;opacity:.85}
  .hole{position:absolute;top:16px;left:50%;width:13px;height:13px;border-radius:50%;background:#0c0e0d;transform:translateX(-50%);z-index:30}
  .gest{position:absolute;bottom:7px;left:50%;width:120px;height:4px;border-radius:3px;background:#1a1a1a;transform:translateX(-50%);opacity:.55;z-index:30}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .top{display:flex;align-items:center;gap:8px;padding:8px 18px 6px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;flex:1}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--moss);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
  .ib{width:38px;height:38px;border-radius:50%;background:var(--sand);display:grid;place-items:center;position:relative}
  .ib.on{background:var(--moss);color:#fff}
  .ib .dot{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#37c47b;border:2px solid var(--paper)}
  .avatar{background:var(--coralTint);color:var(--coral);font-weight:800;font-size:14px}
  .langs{margin:6px 18px 0;background:var(--sand);border-radius:18px;padding:6px;display:flex;align-items:center;gap:6px}
  .pill{flex:1;background:var(--ivory);border-radius:13px;padding:11px 0;text-align:center;font-weight:800;font-size:14px}
  .swap{width:34px;height:34px;border-radius:50%;background:var(--ivory);display:grid;place-items:center}
  .card{margin:12px 18px 0;background:var(--ivory);border:1px solid var(--line);border-radius:22px;padding:16px}
  .src{font-size:19px;line-height:1.35;font-weight:600;min-height:78px}
  .caret{display:inline-block;width:2px;height:20px;background:var(--coral);vertical-align:-4px;margin-left:2px}
  .microw{display:flex;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .listen{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--coral);flex:1}
  .eq{display:flex;gap:3px;align-items:flex-end;height:16px}.eq b{width:3px;background:var(--coral);border-radius:2px}
  .btn{border-radius:26px;padding:11px 18px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
  .btn.coral{background:var(--coral);color:#fff}
  .btn.out{border:1.5px solid var(--moss);background:transparent}
  .btn.cran{background:var(--cran);color:#fff}
  .btn.moss{background:var(--moss);color:#fff}
  .res{margin:12px 18px 0;background:var(--moss);border-radius:22px;padding:16px;color:#fff}
  .res .lbl{display:flex;align-items:center;font-size:11px;letter-spacing:.09em;font-weight:800;color:var(--coral)}
  .res .lbl span{flex:1}.res .lbl em{display:flex;gap:8px;font-style:normal}
  .res .rb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
  .res .rb svg{width:15px;height:15px}
  .res .txt{font-size:20px;line-height:1.35;font-weight:700;margin-top:10px}
  .sec{margin:16px 20px 0;font-size:11px;letter-spacing:.1em;font-weight:800;color:var(--coral);display:flex}.sec span{flex:1}.sec u{text-decoration:none;color:var(--moss);opacity:.6;letter-spacing:0}
  .rec{margin:8px 18px 0;background:var(--ivory);border:1px solid var(--line);border-radius:16px;padding:11px 14px;font-size:13px}
  .tag{display:inline-block;background:#dcebe1;color:#2c6b57;border-radius:8px;padding:2px 7px;font-size:10.5px;font-weight:800;margin-right:6px}
  .rec b{display:block;margin-top:5px;font-size:13.5px}.rec s{text-decoration:none;color:var(--moss);font-weight:800;display:block;margin-top:2px}
  .tabs{margin-top:auto;display:flex;border-top:1px solid var(--line);background:var(--ivory);padding:8px 0 24px;flex:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;opacity:.55}
  .tab .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
  .tab.act{opacity:1}.tab.act .ic{background:var(--coralTint);color:var(--coral)}
  .scrim{position:absolute;inset:0;background:rgba(10,20,18,.5);z-index:10}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 16px 34px;z-index:20}
  .handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet h2{font-size:20px;font-weight:900}.sheet p.d{font-size:13px;opacity:.7;margin:5px 0 14px;line-height:1.4}
  .status2{display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px}
  .led{width:10px;height:10px;border-radius:50%}
  .spin{width:16px;height:16px;border:2px solid var(--coral);border-right-color:transparent;border-radius:50%;margin-left:auto}
  .dev{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .dev strong{display:block;font-size:15px;font-weight:800}.dev small{font-size:12.5px;opacity:.7}.dev>div{flex:1}
  .tip{font-size:12px;opacity:.6;margin-top:10px;line-height:1.4}
  .sw{display:flex;gap:12px;align-items:center;margin:4px 0 14px}.sw>div{flex:1}.sw strong{font-size:14.5px;font-weight:800;display:block}.sw small{font-size:12.5px;opacity:.7;line-height:1.35;display:block;margin-top:3px}
  .toggle{width:46px;height:28px;border-radius:14px;background:var(--moss);position:relative;flex:none}.toggle:after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
  .row2{display:flex;gap:10px}.row2 .btn{flex:1;justify-content:center}
  .appbar{display:flex;align-items:center;gap:10px;padding:8px 14px}.appbar h1{font-size:20px;font-weight:800;flex:1}
  .hdr{margin:8px 18px 0;background:var(--moss);color:#fff;border-radius:22px;padding:16px}
  .hdr .pair{font-size:15px;font-weight:800}.hdr .stats{display:flex;margin-top:14px;gap:6px}.hdr .stats div{flex:1}.hdr small{font-size:11px;opacity:.7;display:block}.hdr b{font-size:13.5px;white-space:nowrap}
  .turn{margin:10px 18px 0;background:var(--ivory);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .turn small{font-size:11px;font-weight:800;color:var(--coral);letter-spacing:.05em}.turn p{font-size:14px;margin-top:5px;line-height:1.35}.turn p.t{font-weight:800}
  .hint{margin:6px 20px 0;font-size:12px;opacity:.6;line-height:1.35}
  .sumc{margin:14px 18px 0;background:var(--coralTint);border-radius:18px;padding:14px}.sumc h3{font-size:15px;font-weight:800}.sumc p{font-size:13.5px;line-height:1.45;margin-top:6px}
  /* composite */
  .comp{display:flex;align-items:center;gap:36px;padding:34px 40px;background:linear-gradient(135deg,#dfe7e2,#f0ebe1);border-radius:28px;width:max-content}
  .glass{width:640px;flex:none}
  .glass .cap{font-weight:800;font-size:13px;letter-spacing:.08em;margin-bottom:10px;opacity:.8}
  .lens{width:640px;height:400px;background:#000;border-radius:26px;border:10px solid #1d2422;box-shadow:inset 0 0 40px rgba(60,255,180,.07),0 14px 40px rgba(0,0,0,.25);position:relative;overflow:hidden}
  .lens div{position:absolute;left:1px;color:#eafff6;font-size:40px;line-height:60px;white-space:pre;font-family:"DejaVu Sans",Roboto,Arial,sans-serif;text-shadow:0 0 8px rgba(120,255,200,.35)}
  .legend{margin-top:14px;font-size:13px;line-height:1.5;opacity:.75}
</style>
</head>
<body>
<div id="mount"></div>
<script>
const I = {
 glasses:'<svg viewBox="0 0 24 24"><path d="M3 8.5c3-1.3 6-1.9 9-1.9s6 .6 9 1.9v7.2c-3 1.4-6 2-9 2s-6-.6-9-2z"/><path d="M8 11.5v2M16 11.5v2"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5v-2a2 2 0 00-2-2h-7a2 2 0 00-2 2v7a2 2 0 002 2h2"/></svg>',
 swap:'<svg viewBox="0 0 24 24"><path d="M4 8h14M15 5l3 3-3 3M20 16H6M9 13l-3 3 3 3"/></svg>',
 stop:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg>',
 trans:'<svg viewBox="0 0 24 24"><path d="M4 6h8M8 4v2M5.5 6c.6 3 2.5 5 5 6M10.5 6c-.6 3-2.8 5.2-6 6.5M13 20l3.5-9 3.5 9M14.2 17h4.6"/></svg>',
 spark:'<svg viewBox="0 0 24 24"><path d="M12 4l1.8 4.7L18.5 10.5 13.8 12.3 12 17l-1.8-4.7L5.5 10.5l4.7-1.8zM18.5 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.6L7 20z"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.7-3.6 3.5-5.5 7-5.5s6.3 1.9 7 5.5"/></svg>',
 bt:'<svg viewBox="0 0 24 24"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></svg>',
 vr:'<svg viewBox="0 0 24 24"><path d="M3 8.5c3-1.3 6-1.9 9-1.9s6 .6 9 1.9v7.2c-3 1.4-6 2-9 2s-6-.6-9-2z"/></svg>',
 chev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
 send:'<svg viewBox="0 0 24 24"><path d="M3.5 11L20.5 3.5 13 20.5l-2.2-7.3z"/></svg>',
 off:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.6 0l3-3a4 4 0 00-5.6-5.6l-1 1M14 10a4 4 0 00-5.6 0l-3 3a4 4 0 005.6 5.6l1-1M4 4l16 16"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13"/></svg>'
};
const phone = (id, inner) => `<div class="phone" id="${id}"><div class="hole"></div><div class="screen"><div class="status"><span>9:41</span><span><i></i><i style="width:16px"></i><i style="width:22px;border-radius:3px"></i></span></div>${inner}<div class="gest"></div></div></div>`;
const tabs = a => `<div class="tabs">${[['trans','Dịch'],['spark','AI'],['book','Sổ tay'],['user','Cá nhân']].map(([k,l],i)=>`<div class="tab ${i===a?'act':''}"><div class="ic">${I[k]}</div>${l}</div>`).join('')}</div>`;
const topBar = connected => `<div class="top"><div class="brand"><div class="mark">文A</div>lingua</div><div class="ib ${connected?'on':''}">${I.glasses}${connected?'<span class="dot"></span>':''}</div><div class="ib">${I.vol}</div><div class="ib avatar">N</div></div>`;
const langs = `<div class="langs"><div class="pill">Tiếng Anh</div><div class="swap">${I.swap}</div><div class="pill">Tiếng Việt</div></div>`;
const recents = `<div class="sec"><span>GẦN ĐÂY</span><u>Xóa tất cả</u></div>
 <div class="rec"><span class="tag">EN → VI</span>08:28<b>Good morning, how are you today?</b><s>Chào buổi sáng, hôm nay bạn thế nào?</s></div>
 <div class="rec"><span class="tag">EN → VI</span>Hôm qua<b>Where is the nearest airport?</b><s>Sân bay gần nhất ở đâu?</s></div>`;
const live = (connected, src, tgt) => `${topBar(connected)}${langs}
 <div class="card"><div class="src">${src}<span class="caret"></span></div>
  <div class="microw"><div class="listen"><div class="eq"><b style="height:6px"></b><b style="height:14px"></b><b style="height:9px"></b><b style="height:16px"></b><b style="height:7px"></b></div>Đang nghe</div><div class="btn coral">${I.stop.replace('<svg','<svg style="width:18px;height:18px"')}Dừng nghe</div></div></div>
 <div class="res"><div class="lbl"><span>TIẾNG VIỆT</span><em><div class="rb">${I.vol}</div><div class="rb">${I.copy}</div></em></div><div class="txt">${tgt}</div></div>
 ${recents}${tabs(0)}`;
const idle = `${topBar(true)}${langs}
 <div class="card"><div class="src" style="color:#9aa59f;font-weight:500">Nhập văn bản…</div><div class="microw"><div class="listen" style="color:#1B4B43;opacity:.55"></div><div class="btn out">${I.vr.replace('<svg','<svg style="display:none"')}🎙 Nói để dịch</div></div></div>${recents}${tabs(0)}`;

const SRC = 'Excuse me, where is the nearest airport? I need to catch a flight at';
const TGT = 'Xin lỗi, sân bay gần nhất ở đâu? Tôi cần bắt chuyến bay lúc';

const scr = {};
scr.voice = phone('voice', live(false, 'Excuse me, where is the nearest airport?', 'Xin lỗi, sân bay gần nhất ở đâu?'));
scr.session = phone('session', `<div class="appbar"><span>${I.back}</span><h1>Hội thoại</h1><span>${I.copy}</span><span>${I.trash}</span></div>
 <div class="hdr"><div class="pair">Tiếng Anh → Tiếng Việt</div><div class="stats"><div><small>Bắt đầu</small><b>09:14:02</b></div><div><small>Kết thúc</small><b>09:15:31</b></div><div><small>Thời lượng</small><b>1 phút 29 giây</b></div></div></div>
 <div style="margin:16px 20px 0;font-weight:800;font-size:15px">Các lượt nói (3)</div>
 <div class="hint">Chạm một lượt để xem chi tiết và lưu từ vựng.</div>
 <div class="turn"><small>09:14:02</small><p>Excuse me, where is the nearest airport?</p><p class="t">→ Xin lỗi, sân bay gần nhất ở đâu?</p></div>
 <div class="turn"><small>09:14:41</small><p>It's about twenty minutes by taxi.</p><p class="t">→ Đi taxi khoảng hai mươi phút.</p></div>
 <div class="turn"><small>09:15:20</small><p>Thank you, I need to catch a flight at ten.</p><p class="t">→ Cảm ơn, tôi cần bắt chuyến bay lúc mười giờ.</p></div>
 <div class="sumc"><h3>Tóm tắt</h3><p>Du khách hỏi đường tới sân bay gần nhất và biết rằng đi taxi mất khoảng 20 phút để kịp chuyến bay lúc 10 giờ.</p></div>`);
const sheetHead = `<div class="handle"></div><h2>Kính phiên dịch</h2><p class="d">Kết nối kính Brilliant Labs Frame để bản dịch hiện ngay trước mắt, theo từng chữ khi bạn đang nói.</p>`;
scr.scan = phone('scan', `${idle.replace(topBar(true), topBar(false))}<div class="scrim"></div><div class="sheet">${sheetHead}
 <div class="status2"><div class="led" style="background:var(--coral)"></div>Đang tìm kính…<div class="spin"></div></div>
 <div style="margin-top:8px"><div class="dev"><span style="color:var(--moss)">${I.vr}</span><div><strong>Frame 7C3E</strong><small>Tín hiệu -48 dBm</small></div>${I.chev}</div>
 <div class="dev"><span style="color:var(--moss)">${I.vr}</span><div><strong>Frame A91F</strong><small>Tín hiệu -71 dBm</small></div>${I.chev}</div></div>
 <div class="btn moss" style="justify-content:center;margin-top:14px;border-radius:30px;padding:14px">${I.stop.replace('<svg','<svg style="width:20px;height:20px"')}Dừng quét</div>
 <p class="tip">Mẹo: tháo kính khỏi sạc, đeo hoặc mở nắp để kính sáng, và đóng các app khác đang giữ kết nối với kính.</p></div>`);
scr.connected = phone('connected', `${idle}<div class="scrim"></div><div class="sheet">${sheetHead}
 <div class="status2"><div class="led" style="background:var(--moss)"></div>Đã kết nối · Frame 7C3E</div>
 <div class="sw" style="margin-top:14px"><div><strong>Bỏ dấu khi hiện trên kính</strong><small>Font mặc định của kính chưa vẽ được dấu tiếng Việt. Tắt nếu firmware kính của bạn đã hỗ trợ.</small></div><div class="toggle"></div></div>
 <div class="row2"><div class="btn out">${I.send.replace('<svg','<svg style="width:18px;height:18px"')}Gửi thử</div><div class="btn cran">${I.off.replace('<svg','<svg style="width:18px;height:18px"')}Ngắt kết nối</div></div></div>`);

// --- re-implementation of FrameService text helpers (for the glasses view) ---
const FROM='àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ';
function strip(s){return s.normalize('NFC').split('').map(ch=>{const l=ch.toLowerCase();const n=l.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('đ','d');if(FROM.includes(l)||l==='đ'){return ch===l?n:n.toUpperCase();}return ch;}).join('');}
function wrap(text,maxUnits,maxLines){const w=c=>c.codePointAt(0)>=0x2E80?2:1;const width=s=>[...s].reduce((a,c)=>a+w(c),0);const lines=[];let cur='',cw=0;for(const word of text.split(/\s+/).filter(Boolean)){const ww=width(word);const need=cw===0?ww:cw+1+ww;if(need>maxUnits){if(cur)lines.push(cur);cur=word;cw=ww;}else{cur=cw===0?word:cur+' '+word;cw=need;}}if(cur)lines.push(cur);return lines.length>maxLines?lines.slice(-maxLines):lines;}
const gl = wrap(strip(TGT),24,4);
const lens = `<div class="lens">${gl.map((l,i)=>`<div style="top:${i*60+1}px">${l}</div>`).join('')}</div>`;
scr.live = `<div class="comp">${phone('live-phone', live(true, SRC, TGT))}<div class="glass"><div class="cap">KÍNH FRAME · MÀN HÌNH 640×400 (MÔ PHỎNG)</div>${lens}<div class="legend">Tối đa 4 dòng cuối, 24 ký tự mỗi dòng, bỏ dấu tiếng Việt.<br>Chỉ bản dịch mới nhất được gửi qua Bluetooth LE.</div></div></div>`;
document.getElementById('mount').innerHTML = Object.entries(scr).map(([k,v])=>`<div id="wrap-${k}" style="width:max-content">${v}</div>`).join('<div style="height:40px"></div>');
</script>
</body>
</html>
